name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
      - name: Demo ve değerlendirme
        run: |
          dotnet run --configuration Release --no-build --project src/EmbeddingSearch.Cli -- eval
          dotnet run --configuration Release --no-build --project src/EmbeddingSearch.Cli -- bench --n 5000
